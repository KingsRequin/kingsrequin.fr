<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — KingsRequin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --abyss: #030810;
            --cyan: #00e5ff;
            --cyan-dim: rgba(0, 229, 255, 0.15);
            --teal: #00bcd4;
            --bio: #00ffc8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--abyss);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Unbounded', sans-serif;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 30%, var(--abyss) 100%);
            z-index: 1;
        }

        .depth-gradient {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(180deg,
                rgba(0, 30, 60, 0.4) 0%, transparent 30%,
                transparent 70%, rgba(0, 10, 30, 0.7) 100%
            );
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0 24px;
        }

        .shark-ascii {
            font-family: monospace;
            font-size: clamp(1rem, 3vw, 2rem);
            color: var(--cyan);
            opacity: 0.3;
            margin-bottom: 32px;
            animation: drift 4s ease-in-out infinite;
            white-space: pre;
        }

        @keyframes drift {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25%  { transform: translateX(20px) rotate(1deg); }
            75%  { transform: translateX(-20px) rotate(-1deg); }
        }

        .code {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 900;
            color: transparent;
            background: linear-gradient(180deg, #fff 0%, var(--teal) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            line-height: 1;
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.2s both;
        }

        .message {
            font-size: clamp(0.6rem, 1.8vw, 1rem);
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--teal);
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.5s both;
            margin-bottom: 40px;
        }

        .back-link {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(0.45rem, 1.2vw, 0.65rem);
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--cyan);
            text-decoration: none;
            opacity: 0;
            animation: fadeUp 0.8s ease-out 0.8s both;
            position: relative;
            transition: opacity 0.3s ease, text-shadow 0.3s ease;
        }

        .back-link:hover {
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
        }

        .back-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--cyan);
            transition: width 0.3s ease;
        }

        .back-link:hover::after {
            width: 100%;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 0.6; transform: translateY(0); }
        }

        /* Bubbles */
        .bubble {
            position: fixed;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.2);
            background: radial-gradient(circle at 30% 30%, rgba(0, 229, 255, 0.06), transparent);
            pointer-events: none;
            z-index: 5;
            animation: rise linear infinite;
        }

        @keyframes rise {
            from { transform: translateY(0) scale(1); opacity: 0.5; }
            to   { transform: translateY(-100vh) scale(0.4); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="vignette"></div>
    <div class="depth-gradient"></div>

    <div class="content">
        <div class="shark-ascii">&gt;==|)&gt;    ...    ?</div>
        <div class="code">404</div>
        <div class="message">Lost in the abyss</div>
        <a href="/" class="back-link">Return to the surface</a>
    </div>

    <script>
    // Ambient bubbles
    function spawnBubble() {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 4 + Math.random() * 12;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 100 + 'vw';
        b.style.bottom = '-20px';
        b.style.animationDuration = (6 + Math.random() * 8) + 's';
        document.body.appendChild(b);
        b.addEventListener('animationend', () => b.remove());
    }
    setInterval(spawnBubble, 800);
    for (let i = 0; i < 5; i++) setTimeout(spawnBubble, i * 150);
    </script>
</body>
</html>
